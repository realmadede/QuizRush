<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuizRush · Join a Game</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="landing-wrap">
        <div class="landing-card">
            <div class="landing-logo">
                <h1>🎯 QuizRush</h1>
                <p>Real-time quiz battles — enter to play</p>
            </div>

            <form id="joinForm" autocomplete="off">
                <div class="form-group">
                    <label for="pinInput">Game PIN</label>
                    <input
                        type="text"
                        id="pinInput"
                        class="form-control"
                        inputmode="numeric"
                        maxlength="6"
                        placeholder="6-digit PIN"
                        required
                        autocomplete="off"
                    />
                </div>
                <div class="form-group">
                    <label for="nickInput">Your Nickname</label>
                    <input
                        type="text"
                        id="nickInput"
                        class="form-control"
                        maxlength="20"
                        placeholder="e.g. Amara"
                        required
                        autocomplete="off"
                    />
                </div>
                <button type="submit" id="joinBtn" class="btn btn-primary btn-lg btn-full">
                    Join Game →
                </button>
                <div id="joinError" class="msg msg-error hidden"></div>
            </form>

            <hr class="landing-divider" />
            <a href="host.html" class="host-link">🎤 Host a game instead</a>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "firebase/app":       "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"
            }
        }
    </script>
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/utils.js"></script>
    <script type="module" src="js/player.js"></script>
</body>
</html>
