<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>QuizRush · Player</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div id="playerApp" class="player-app">

        <!-- ══ LOBBY WAITING ══ -->
        <div id="playerLobby" class="player-view active">
            <div style="margin:auto 0;">
                <div class="player-lobby-card">
                    <div class="pin-scoreboard" style="margin:0 auto 0.75rem;display:inline-flex;">
                        <span class="pin-label">PIN</span>
                        <span class="pin-digits" id="playerPinDisplay">——————</span>
                    </div>
                    <h2 class="waiting-title">⏳ Waiting for host…</h2>
                    <p class="waiting-sub">The game will start soon</p>
                    <div style="margin-top:0.75rem;">
                        <span class="pulse-dot"></span>
                        <span class="pulse-dot"></span>
                        <span class="pulse-dot"></span>
                    </div>
                    <div class="player-nick-display" id="playerNickDisplay">—</div>
                </div>
            </div>
        </div>

        <!-- ══ QUESTION ══ -->
        <div id="playerQuestion" class="player-view">
            <div class="player-q-header">
                <h1>🎯</h1>
                <span class="q-timer-badge" id="playerTimerBadge">20s</span>
            </div>

            <div class="timer-bar-track">
                <div class="timer-bar-fill" id="playerTimerBar"></div>
            </div>

            <p class="player-q-text" id="playerQText">Loading question…</p>

            <div id="playerChoices" class="player-choices-grid">
                <!-- 4 pads injected by JS -->
            </div>

            <!-- Feedback overlay -->
            <div id="playerFeedback" class="feedback-overlay hidden">
                <div class="feedback-card">
                    <span class="feedback-icon" id="feedbackIcon">✅</span>
                    <span class="feedback-text" id="feedbackText">Correct!</span>
                    <span class="feedback-pts"  id="feedbackPts">+1000</span>
                </div>
            </div>
        </div>

        <!-- ══ LEADERBOARD ══ -->
        <div id="playerLeaderboard" class="player-view">
            <div class="player-lb-header">
                <h2>🏆 Leaderboard</h2>
                <span class="lb-round-label" id="playerLbRound">After Q1</span>
            </div>
            <div class="player-lb-wrap">
                <ol id="playerLbList" class="lb-list player-lb-list"></ol>
                <p class="lb-waiting">
                    <span class="pulse-dot"></span>
                    <span class="pulse-dot"></span>
                    <span class="pulse-dot"></span>
                    Waiting for next question…
                </p>
            </div>
        </div>

        <!-- ══ FINISHED ══ -->
        <div id="playerFinished" class="player-view">
            <div class="player-finished-wrap">
                <h2>🏁 Final Results</h2>
                <ol id="playerFinalLb" class="lb-list player-lb-list" style="margin-top:1rem;"></ol>
                <p class="thanks-msg">Thanks for playing QuizRush!</p>
            </div>
        </div>

    </div><!-- /playerApp -->

    <script type="importmap">
        {
            "imports": {
                "firebase/app":       "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"
            }
        }
    </script>
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/utils.js"></script>
    <script type="module" src="js/player.js"></script>
</body>
</html>
